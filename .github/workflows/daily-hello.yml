name: Daily Hello

on:
  schedule:
    # 매일 09:00 KST (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 무작위 문구로 README 갱신
        run: |
          QUOTE=$(shuf -n 1 quotes.txt)
          awk -v q="$QUOTE" '
            /<!-- START:오늘의 한마디 -->/ { print; print q; skip=1; next }
            /<!-- END:오늘의 한마디 -->/ { skip=0 }
            !skip { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
          else
            git commit -m "chore: 오늘의 한마디 갱신 ($(date -u +'%Y-%m-%d'))"
            git push
          fi
