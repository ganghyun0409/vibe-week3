<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀 메모장</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FDEFF4, #E8F3FB 50%, #F2EAFB);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #6b5b6b;
      padding: 24px 0;
      box-sizing: border-box;
    }

    .card {
      background: #ffffffcc;
      border-radius: 28px;
      padding: 36px 32px;
      width: 380px;
      box-shadow: 0 12px 30px rgba(200, 170, 200, 0.35);
      border: 2px solid #FBE1EE;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 700;
      color: #a87ca8;
      text-align: center;
    }

    /* 잠금 화면 */
    #setupArea, #lockArea {
      display: none;
    }

    #setupArea.active, #lockArea.active {
      display: block;
    }

    .lock-row {
      display: flex;
      gap: 8px;
    }

    .lock-row + .lock-row {
      margin-top: 8px;
    }

    .lock-row input {
      flex: 1;
      min-width: 0;
      border: 2px solid #FBE1EE;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      color: #6b5b6b;
      background: #FFFDFE;
      outline: none;
      font-family: inherit;
    }

    .lock-row input:focus {
      border-color: #FFB6D2;
    }

    .lock-row button {
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #FFB6D2, #C9A6E8);
      cursor: pointer;
      white-space: nowrap;
    }

    .lock-row button:hover {
      opacity: 0.9;
    }

    .lock-msg {
      min-height: 18px;
      margin-top: 10px;
      font-size: 13px;
      color: #d97b9a;
      text-align: center;
    }

    /* 메모장 */
    .note-area {
      display: none;
    }

    .note-area.unlocked {
      display: block;
    }

    .note-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .note-row input {
      flex: 1;
      min-width: 0;
      border: 2px solid #FBE1EE;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      color: #6b5b6b;
      background: #FFFDFE;
      outline: none;
      font-family: inherit;
    }

    .note-row input:focus {
      border-color: #FFB6D2;
    }

    .note-row button {
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #FFB6D2, #C9A6E8);
      cursor: pointer;
      white-space: nowrap;
    }

    .note-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .note-list li {
      background: #F5F0FB;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      color: #7a6a8a;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      font-size: 13px;
      color: #b8a8b8;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 비밀 메모장</h1>

    <div id="setupArea">
      <div class="lock-row">
        <input type="password" id="newPasswordInput" placeholder="사용할 비밀번호를 설정하세요">
      </div>
      <div class="lock-row">
        <input type="password" id="confirmPasswordInput" placeholder="비밀번호 확인">
        <button onclick="setPassword()">설정</button>
      </div>
      <div class="lock-msg" id="setupMsg"></div>
    </div>

    <div id="lockArea">
      <div class="lock-row">
        <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요">
        <button onclick="checkPassword()">확인</button>
      </div>
      <div class="lock-msg" id="lockMsg"></div>
    </div>

    <div class="note-area" id="noteArea">
      <div class="note-row">
        <input type="text" id="noteInput" placeholder="메모를 입력하세요">
        <button onclick="addNote()">추가</button>
      </div>
      <ul class="note-list" id="noteList"></ul>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'secretNotePasswordHash';
    const notes = [];

    const setupArea = document.getElementById('setupArea');
    const lockArea = document.getElementById('lockArea');
    const noteArea = document.getElementById('noteArea');
    const newPasswordInput = document.getElementById('newPasswordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const setupMsg = document.getElementById('setupMsg');
    const passwordInput = document.getElementById('passwordInput');
    const lockMsg = document.getElementById('lockMsg');
    const noteInput = document.getElementById('noteInput');
    const noteList = document.getElementById('noteList');

    async function sha256Hex(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function unlock() {
      setupArea.classList.remove('active');
      lockArea.classList.remove('active');
      noteArea.classList.add('unlocked');
    }

    async function setPassword() {
      const pw = newPasswordInput.value;
      const confirm = confirmPasswordInput.value;

      if (!pw) {
        setupMsg.textContent = '비밀번호를 입력해 주세요.';
        return;
      }
      if (pw !== confirm) {
        setupMsg.textContent = '비밀번호가 일치하지 않습니다.';
        return;
      }

      localStorage.setItem(STORAGE_KEY, await sha256Hex(pw));
      unlock();
    }

    async function checkPassword() {
      const input = passwordInput.value;
      const storedHash = localStorage.getItem(STORAGE_KEY);

      if (await sha256Hex(input) === storedHash) {
        unlock();
      } else {
        lockMsg.textContent = '비밀번호가 틀렸습니다.';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    confirmPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setPassword();
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function renderNotes() {
      noteList.innerHTML = '';

      if (notes.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.style.background = 'transparent';
        empty.textContent = '아직 메모가 없어요';
        noteList.appendChild(empty);
        return;
      }

      notes.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        noteList.appendChild(li);
      });
    }

    function addNote() {
      const text = noteInput.value.trim();
      if (!text) return;
      notes.push(text);
      noteInput.value = '';
      noteInput.focus();
      renderNotes();
    }

    noteInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addNote();
    });

    if (localStorage.getItem(STORAGE_KEY)) {
      lockArea.classList.add('active');
    } else {
      setupArea.classList.add('active');
    }
    renderNotes();
  </script>
</body>
</html>
